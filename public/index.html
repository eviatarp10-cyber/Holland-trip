<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>הטיול שלנו להולנד</title>
  <meta name="description" content="הלוז היומי של הטיול המשפחתי להולנד">
  <meta name="theme-color" content="#f37021">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="הולנד">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="trip-title">הטיול שלנו להולנד</h1>
      <p id="trip-meta" class="trip-meta"></p>
    </div>
    <nav id="daystrip" class="daystrip" aria-label="בחירת יום"></nav>
  </header>

  <main id="day-view" class="day-view" aria-live="polite"></main>

  <footer class="footer">
    <button id="btn-all" class="link-btn" type="button">הצגת כל הימים ברצף</button>
  </footer>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-grip" aria-hidden="true"></div>
      <button id="sheet-close" class="sheet-close" type="button" aria-label="סגירה">✕</button>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </dialog>

  <script src="itinerary.js"></script>
  <script src="app.js"></script>
</body>
</html>
